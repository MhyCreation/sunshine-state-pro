/* ============================================================
   DESIGN TOKENS — Sunshine State Cleaning CRM
   ============================================================ */
:root {
  /* Navy */
  --navy-950: #0B1736;
  --navy-900: #142555;
  --navy-800: #1B2F69;
  --navy-700: #25408A;
  --navy-600: #3253A8;
  --navy-500: #4A6BC1;
  --navy-400: #7B95D3;
  --navy-300: #A8BCE2;
  --navy-200: #D0DAEE;
  --navy-100: #E7ECF6;
  --navy-50:  #F4F6FB;

  /* Gold */
  --gold-900: #6E4E10;
  --gold-800: #8E661A;
  --gold-700: #B6831F;
  --gold-600: #D29A28;
  --gold-500: #E5B143;
  --gold-400: #EFC465;
  --gold-300: #F4D38A;
  --gold-200: #F8E2B0;
  --gold-100: #FBEBC4;
  --gold-50:  #FDF6E4;

  /* Neutrals */
  --white:     #FFFFFF;
  --cream:     #FAF7F0;
  --slate-50:  #F6F7F9;
  --slate-100: #EDEFF3;
  --slate-200: #DDE1E8;
  --slate-300: #C2C8D3;
  --slate-400: #98A0B0;
  --slate-500: #6E7689;
  --slate-600: #525A6C;
  --slate-700: #3D4456;
  --slate-800: #2A3142;
  --slate-900: #161A26;

  /* Semantic */
  --success-700: #156F47; --success-500: #1F8A5B; --success-100: #D5EFE2;
  --warning-700: #9A6914; --warning-500: #D89222; --warning-100: #FBEBC4;
  --danger-700:  #9B2F2A; --danger-500:  #C8443D; --danger-100:  #F7DAD7;
  --info-700:    #1F549F; --info-500:    #2A6FDB; --info-100:    #D8E5F8;

  /* Roles */
  --bg-app:     var(--cream);
  --fg-1: var(--slate-900);
  --fg-2: var(--slate-700);
  --fg-3: var(--slate-500);
  --fg-4: var(--slate-400);

  /* Typography */
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-sans:    'Manrope', system-ui, sans-serif;
  --font-script:  'Sacramento', cursive;
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;

  /* Spacing (4px base) */
  --space-3: 8px;  --space-4: 12px; --space-5: 16px; --space-6: 20px;
  --space-7: 24px; --space-8: 32px; --space-9: 40px;

  /* Radii */
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px;
  --radius-xl: 28px; --radius-pill: 9999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(20,37,85,.06);
  --shadow-sm: 0 1px 2px rgba(20,37,85,.05), 0 2px 6px rgba(20,37,85,.06);
  --shadow-md: 0 2px 4px rgba(20,37,85,.05), 0 8px 20px rgba(20,37,85,.08);
  --shadow-lg: 0 4px 8px rgba(20,37,85,.06), 0 16px 40px rgba(20,37,85,.10);
  --shadow-xl: 0 8px 16px rgba(20,37,85,.08), 0 32px 64px rgba(20,37,85,.14);
  --shadow-gold-glow: 0 0 0 4px rgba(229,177,67,.25);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.5);

  /* Motion */
  --ease-out:   cubic-bezier(.22,1,.36,1);
  --dur-fast:   120ms;
  --dur-base:   200ms;

  /* Layout */
  --sidebar-w: 264px;
  --topbar-h:  64px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #app { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg-1);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: var(--navy-700); text-decoration-color: var(--gold-400); }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; overflow: hidden; }
.main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg-app); }
.content { flex: 1; overflow-y: auto; padding: 28px 36px 60px; }
.content-narrow { max-width: 1240px; margin: 0 auto; }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  background: var(--navy-900);
  color: rgba(255,255,255,.85);
  display: flex; flex-direction: column;
  padding: 18px 14px;
  gap: 14px;
  overflow-y: auto;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-brand .mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--gold-500);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-brand .name {
  font-family: var(--font-display); font-weight: 700; font-size: 16px;
  line-height: 1.1; letter-spacing: -.01em; color: white;
}
.sidebar-brand .name small {
  display: block; font-family: var(--font-sans); font-weight: 500;
  font-size: 11px; color: var(--gold-300);
  letter-spacing: .06em; text-transform: uppercase; margin-top: 2px;
}
.sidebar-section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: rgba(255,255,255,.35);
  padding: 8px 12px 4px;
}
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border-radius: 12px;
  color: rgba(255,255,255,.72); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: 150ms;
  position: relative; background: none; border: none; text-align: left; width: 100%;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: white; }
.nav-item.active { background: rgba(229,177,67,.14); color: var(--gold-300); font-weight: 600; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 3px; background: var(--gold-500);
}
.nav-item .count {
  margin-left: auto; background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.8); font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 9999px;
}
.nav-item.active .count { background: var(--gold-500); color: var(--navy-900); }
.sidebar-foot {
  margin-top: auto; padding: 10px; border-radius: 14px;
  background: rgba(255,255,255,.04);
  display: flex; gap: 10px; align-items: center;
  border: none; width: 100%; text-align: left; cursor: pointer;
  transition: 150ms;
}
.sidebar-foot:hover { background: rgba(255,255,255,.08); }

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
  height: var(--topbar-h); background: white;
  border-bottom: 1px solid var(--slate-100);
  display: flex; align-items: center;
  padding: 0 28px; gap: 16px; flex-shrink: 0;
}
.topbar-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.search {
  display: flex; align-items: center; gap: 10px;
  background: var(--slate-50); border: 1px solid var(--slate-100);
  border-radius: 12px; padding: 8px 14px;
  width: 360px; max-width: 100%; margin-left: auto; color: var(--fg-3);
}
.search input { border: none; background: none; outline: none; font-family: inherit; font-size: 14px; color: var(--fg-1); width: 100%; }
.search kbd { font-family: var(--font-mono); font-size: 10px; background: white; border: 1px solid var(--slate-200); border-radius: 6px; padding: 2px 6px; color: var(--fg-3); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  font-family: var(--font-sans); font-size: 14px; font-weight: 600;
  padding: 10px 18px; border-radius: 14px; border: 1px solid transparent;
  cursor: pointer; transition: all 180ms var(--ease-out);
  display: inline-flex; align-items: center; gap: 8px; line-height: 1; white-space: nowrap;
}
.btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(229,177,67,.35); }
.btn-primary { background: var(--navy-900); color: white; box-shadow: var(--shadow-xs), var(--shadow-inset); }
.btn-primary:hover { background: var(--navy-800); }
.btn-primary:active { background: var(--navy-950); transform: translateY(1px); }
.btn-secondary { background: white; color: var(--navy-900); border-color: var(--slate-200); }
.btn-secondary:hover { background: var(--slate-50); border-color: var(--slate-300); }
.btn-accent { background: var(--gold-500); color: var(--navy-900); }
.btn-accent:hover { background: var(--gold-600); }
.btn-ghost { background: transparent; color: var(--navy-700); border: none; }
.btn-ghost:hover { background: var(--slate-100); }
.btn-danger { background: var(--danger-100); color: var(--danger-700); border-color: var(--danger-100); }
.btn-danger:hover { background: var(--danger-500); color: white; }
.btn-icon { padding: 9px; border-radius: 12px; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }

/* ============================================================
   CARDS
   ============================================================ */
.card { background: white; border-radius: 20px; box-shadow: var(--shadow-sm); overflow: hidden; }
.card-pad { padding: 24px; }
.card-head {
  padding: 18px 24px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--slate-100);
}
.card-head .h-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 9999px;
  font-size: 12px; font-weight: 600; line-height: 1.3;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.b-success { background: var(--success-100); color: var(--success-700); }
.b-warning { background: var(--warning-100); color: var(--warning-700); }
.b-danger  { background: var(--danger-100);  color: var(--danger-700); }
.b-info    { background: var(--info-100);    color: var(--info-700); }
.b-neutral { background: var(--slate-100);   color: var(--slate-700); }
.b-navy    { background: var(--navy-900);    color: white; }
.b-gold    { background: var(--gold-500);    color: var(--navy-900); }
.b-outline { background: white; color: var(--navy-700); border: 1px solid var(--navy-200); }

/* ============================================================
   AVATARS
   ============================================================ */
.av {
  border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-family: var(--font-sans); color: var(--navy-900); flex-shrink: 0; user-select: none;
}
.av-stack { display: flex; }
.av-stack > .av { border: 2px solid white; }
.av-stack > .av + .av { margin-left: -8px; }

/* ============================================================
   KPI CARDS
   ============================================================ */
.kpi { padding: 22px 24px; }
.kpi-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-700); }
.kpi-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; margin-top: 6px; }
.kpi-foot { font-size: 13px; color: var(--fg-3); margin-top: 4px; }
.kpi-delta { color: var(--success-700); font-weight: 600; }
.kpi-delta.down { color: var(--danger-700); }

/* ============================================================
   FORMS & TABLE
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.input, .select-field, .textarea {
  font-family: var(--font-sans); font-size: 14px;
  padding: 10px 14px; border-radius: 14px;
  border: 1px solid var(--slate-200);
  background: white; color: var(--fg-1); transition: 150ms; width: 100%;
}
.input:focus, .select-field:focus, .textarea:focus {
  outline: none; border-color: var(--navy-700); box-shadow: var(--shadow-gold-glow);
}
.table { width: 100%; border-collapse: separate; border-spacing: 0; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 700; color: var(--fg-3); padding: 12px 20px;
  background: var(--slate-50); border-bottom: 1px solid var(--slate-100);
}
.table td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid var(--slate-100); vertical-align: middle; }
.table tr:hover td { background: var(--slate-50); cursor: pointer; }
.table tr:last-child td { border-bottom: none; }
.t-right { text-align: right; }
.mono { font-family: var(--font-mono); }

/* ============================================================
   PAGE HEADER, TABS, GRID
   ============================================================ */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.2; margin: 6px 0 0; letter-spacing: -.02em; }
.page-head .eyebrow { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--gold-700); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--slate-100); margin-bottom: 18px; }
.tab { padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--fg-3); cursor: pointer; border-bottom: 2px solid transparent; transition: 150ms; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--font-sans); }
.tab:hover { color: var(--fg-1); }
.tab.active { color: var(--navy-900); border-bottom-color: var(--gold-500); }
.grid-12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
.col-3 { grid-column: span 3; }
.col-4 { grid-column: span 4; }
.col-6 { grid-column: span 6; }
.col-8 { grid-column: span 8; }

/* ============================================================
   DRAWER / MODAL
   ============================================================ */
.scrim { position: fixed; inset: 0; background: rgba(11,23,54,.45); backdrop-filter: blur(2px); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--cream); z-index: 51; box-shadow: var(--shadow-xl); overflow-y: auto; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 22px 24px 18px; border-bottom: 1px solid var(--slate-200); }

/* ============================================================
   LOGIN
   ============================================================ */
.login-wrap {
  min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
}
.login-left {
  background: var(--navy-900); display: flex; flex-direction: column;
  justify-content: space-between; padding: 48px;
  position: relative; overflow: hidden;
}
.login-left::before {
  content: ''; position: absolute; top: 30%; left: 50%;
  transform: translate(-50%, -50%);
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(229,177,67,.12) 0%, transparent 70%);
  pointer-events: none;
}
.login-right {
  background: white; display: flex; align-items: center; justify-content: center;
  padding: 48px;
}
.login-form { width: 100%; max-width: 360px; }
.login-logo-mark {
  width: 52px; height: 52px; border-radius: 16px; background: var(--gold-500);
  display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
}

/* ============================================================
   MISC
   ============================================================ */
.divider { height: 1px; background: var(--slate-100); }
.icon-wrap { display: inline-flex; align-items: center; justify-content: center; }
</style>
</head>

/* ============================================================
   ICON (Lucide via global)
   ============================================================ */
function Icon({ name, size = 18, color, style, className }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      if (color) el.style.color = color;
      ref.current.appendChild(el);
      window.lucide.createIcons({ attrs: { width: size, height: size }, nodes: [el] });
    }
  }, [name, size, color]);
  return <span ref={ref} className={`icon-wrap ${className || ''}`} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, ...style }} />;
}

/* ============================================================
   AVATAR
   ============================================================ */
const AV_COLORS = ['#F4D38A', '#A8BCE2', '#E5B143', '#D0DAEE', '#7B95D3', '#FBEBC4'];
function avColor(name) {
  let h = 0;
  for (const c of (name || '')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return AV_COLORS[h % AV_COLORS.length];
}
function initials(name) {
  return (name || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
}
function Avatar({ name, size = 32, color, status }) {
  const bg = color || avColor(name);
  return (
    <div className="av" style={{ width: size, height: size, background: bg, fontSize: Math.max(10, size * 0.38), position: 'relative' }}>
      {initials(name)}
      {status && <span style={{ position: 'absolute', right: -1, bottom: -1, width: Math.max(8, size * 0.28), height: Math.max(8, size * 0.28), borderRadius: '50%', background: status === 'online' ? 'var(--success-500)' : 'var(--slate-300)', border: '2px solid white' }} />}
    </div>
  );
}
function AvatarStack({ names, size = 28, max = 4 }) {
  const vis = names.slice(0, max);
  const extra = names.length - vis.length;
  return (
    <div className="av-stack">
      {vis.map((n, i) => <Avatar key={i} name={n} size={size} />)}
      {extra > 0 && <div className="av" style={{ width: size, height: size, background: 'var(--navy-900)', color: 'white', fontSize: 11, marginLeft: -8, border: '2px solid white', borderRadius: '50%', zIndex: 1 }}>+{extra}</div>}
    </div>
  );
}

/* ============================================================
   BADGE
   ============================================================ */
function Badge({ tone = 'neutral', dot, children }) {
  return (
    <span className={`badge b-${tone}`}>
      {dot && <span className="dot" style={{ background: 'currentColor', opacity: .7 }} />}
      {children}
    </span>
  );
}

/* ============================================================
   BUTTON
   ============================================================ */
function Btn({ variant = 'primary', size, icon, children, onClick, type = 'button', style, disabled }) {
  const cls = ['btn', `btn-${variant}`, size === 'sm' ? 'btn-sm' : '', icon && !children ? 'btn-icon' : ''].filter(Boolean).join(' ');
  const iconSize = size === 'sm' ? 13 : 15;
  return (
    <button type={type} className={cls} onClick={onClick} style={style} disabled={disabled}>
      {icon && <Icon name={icon} size={iconSize} />}
      {children}
    </button>
  );
}

/* ============================================================
   CARD
   ============================================================ */
function Card({ pad = true, children, style, onClick }) {
  return <div className={`card${pad ? ' card-pad' : ''}`} style={style} onClick={onClick}>{children}</div>;
}
function CardHead({ title, icon, action }) {
  return (
    <div className="card-head">
      {icon && <Icon name={icon} size={17} style={{ color: 'var(--navy-700)' }} />}
      <span className="h-title">{title}</span>
      {action && <span style={{ marginLeft: 'auto' }}>{action}</span>}

  );
}

          <div style={{ fontFamily:'var(--font-display)', fontSize:40, fontWeight:700, color:'white', lineHeight:1.1, letterSpacing:'-.02em', maxWidth:360 }}>
            Run your cleaning business — on autopilot.
          </div>
          <p style={{ marginTop:20, fontSize:15, color:'rgba(255,255,255,.6)', lineHeight:1.6, maxWidth:340 }}>
            Scheduling, CRM, invoicing, crew payroll, and AI follow-ups in one calm, beautifully designed workspace.
          </p>
        </div>
        <div style={{ position:'relative' }}>
          <div style={{ fontFamily:'var(--font-display)', fontSize:20, color:'rgba(255,255,255,.2)', marginBottom:12 }}>"</div>
          <blockquote style={{ fontFamily:'var(--font-display)', fontSize:18, color:'rgba(255,255,255,.9)', lineHeight:1.45, marginBottom:20 }}>
            We replaced four tools with Sunshine. Our crews ship 40% more jobs.
          </blockquote>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <Avatar name="Marcus Reyes" size={40} color="#E5B143" />
            <div>
              <div style={{ fontSize:14, fontWeight:600, color:'white' }}>Marcus Reyes</div>
              <div style={{ fontSize:12, color:'rgba(255,255,255,.5)' }}>Reyes Pressure Washing · Tampa</div>
            </div>
            <div style={{ marginLeft:'auto', display:'flex', gap:2 }}>
              {[...Array(5)].map((_,i) => <Icon key={i} name="star" size={14} color="var(--gold-500)" />)}
            </div>
          </div>
        </div>
      </div>

      <div className="login-right">
        <div className="login-form">
          <div className="login-logo-mark">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="21" r="7" fill="white"/>
              <g stroke="white" strokeWidth="2.2" strokeLinecap="round">
                <line x1="16" y1="5"  x2="16" y2="9"/>
                <line x1="5"  y1="21" x2="9"  y2="21"/>
                <line x1="23" y1="21" x2="27" y2="21"/>
                <line x1="8"  y1="12" x2="11" y2="15"/>
                <line x1="24" y1="12" x2="21" y2="15"/>
              </g>
            </svg>
          </div>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:28, fontWeight:700, letterSpacing:'-.02em', lineHeight:1.1, marginBottom:6 }}>Welcome back</h2>
          <p style={{ fontSize:14, color:'var(--fg-3)', marginBottom:32 }}>Sign in to your Sunshine workspace.</p>

          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <div className="field">
              <label>Email</label>
              <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@company.com" />
            </div>
            <div className="field">
              <div style={{ display:'flex', justifyContent:'space-between' }}>
                <label>Password</label>
                <button onClick={() => {}} style={{ fontSize:12, color:'var(--navy-500)', background:'none', border:'none', cursor:'pointer', padding:0 }}>Forgot password?</button>
              </div>
              <div style={{ position:'relative' }}>
                <input className="input" type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" style={{ paddingRight:44 }} />
                <button onClick={() => setShowPw(v=>!v)} style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--fg-3)' }}>
                  <Icon name={showPw?'eye-off':'eye'} size={16} />
                </button>
              </div>
            </div>
            <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center', marginTop:4, fontSize:15, padding:'13px 24px' }} onClick={onLogin}>
              Sign in
              <Icon name="arrow-right" size={16} />
            </button>
          </div>

          <p style={{ marginTop:28, textAlign:'center', fontSize:13, color:'var(--fg-3)' }}>
            New to Sunshine? <a href="#" style={{ color:'var(--navy-800)', fontWeight:600, textDecoration:'none' }}>Start free trial →</a>
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP SHELL
   ============================================================ */
const SCREEN_TITLES = {
  dashboard: 'Dashboard',
  customers: 'Customers',
  estimates: 'Estimates',
  invoices:  'Invoices',
  crew:      'Crew & Payroll',
  reports:   'Reports',
  settings:  'Settings',
};

function App() {
  const [screen, setScreen] = useState('login');
  const [job, setJob] = useState(null);

  if (screen === 'login') {
    return <LoginScreen onLogin={() => setScreen('dashboard')} />;
  }

  const renderScreen = () => {
    switch (screen) {
      case 'dashboard': return <DashboardScreen onOpenJob={j => setJob(j)} />;
      case 'customers': return <CustomersScreen />;
      case 'estimates': return <EstimatesScreen />;
      case 'invoices':  return <InvoicesScreen />;
      case 'crew':      return <CrewPayrollScreen />;
      case 'reports':   return <ReportsScreen />;
      case 'settings':  return <SettingsScreen />;
      default:          return <DashboardScreen onOpenJob={j => setJob(j)} />;
    }
  };

  const topActions = {
    dashboard: <Btn variant="primary" icon="plus" size="sm">New Job</Btn>,
    invoices:  <Btn variant="primary" icon="plus" size="sm">New Invoice</Btn>,
    estimates: <Btn variant="primary" icon="plus" size="sm">New Estimate</Btn>,
  };

  return (
    <div className="app">
      <Sidebar current={screen} onNav={id => { setScreen(id); setJob(null); }} />
      <div className="main">
        <TopBar title={SCREEN_TITLES[screen] || 'CRM'} action={topActions[screen]} />
        <div className="content">
          {renderScreen()}
        </div>
      </div>
      {job && <JobDrawer job={job} onClose={() => setJob(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
